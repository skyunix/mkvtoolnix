name: Sync Upstream

on:
  schedule:
    - cron: '1 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mkvtoolnix
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # 完整历史,merge 需要共同祖先

      - name: Merge upstream main and sync tags
        run: |
          set -euo pipefail

          git config user.name  "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          git remote add upstream https://codeberg.org/mbunkus/mkvtoolnix.git
          git fetch upstream main --tags --force

          git merge upstream/main --no-edit
          git push origin main
          git push origin --tags --force
